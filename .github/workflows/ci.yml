name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  # A pull request's newer push replaces its older run; every push to main and every merge group
  # keeps its own run, keyed by the commit sha, so one merge group never cancels another.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Harness, generated files and type check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: scripts/typecheck.py.lock

      - name: Harness tests
        run: uv run --no-project --with-requirements harness/test-requirements-min.txt python -B -m unittest discover -s harness -p 'test_*.py'

      - name: Script tests
        run: uv run --no-project --python 3.12 --with-requirements harness/test-requirements-min.txt python -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Explicit text encoding
        run: uvx ruff@0.17.4 check --select PLW1514 --preview skills/*/scripts

      - name: Complexity ratchet
        run: uv run --no-project --script scripts/complexity_ratchet.py

      # Import-time errors (unhashable dataclass defaults, bad annotations) survive compileall, so import
      # every module. Modules that need FreeCAD or other unavailable packages are listed as SKIPPED.
      - name: Import every module
        run: uv run --no-project --python 3.12 --with-requirements harness/test-requirements.txt python -B scripts/import_check.py

      # freecadcmd runs FreeCAD's bundled Python 3.11, so the modules its jobs load must compile and
      # import there. scripts/freecad_job_modules.txt lists them; reviewers keep it complete.
      - name: FreeCAD job code on Python 3.11
        run: uv run --no-project --python 3.11 --with-requirements harness/test-requirements-freecad.txt python -B scripts/import_check.py --manifest

      - name: Generated files
        run: uv run --no-project --with-requirements harness/test-requirements-min.txt python -B harness/generate.py --check

      - name: Generated typed API and schema reference
        run: uv run --no-project --python 3.11 python -B scripts/gen_api.py --check

      - name: Scoped Python type check
        run: uv run --no-project --locked --script scripts/typecheck.py

      # CI has nothing staged, so --committed checks the stamp against HEAD's hw/ tree. The fixture
      # stands in until examples/lamp-arm can be stamped (issue #159).
      - name: Committed recheck stamp of the verify-project fixture
        run: uv run --no-project --python 3.12 --with-requirements harness/test-requirements.txt python -B skills/cad-recheck/scripts/stamp.py --verify --committed --hw skills/cad-recheck/tests/fixtures/verify-project/hw

      - name: REUSE licence compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  changes:
    name: Skill shard gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      # The full history gives the base...head diff its merge base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # skip=true only on a pull request whose changed paths no skill test reads (docs_only.py).
      - name: Decide whether the skill shards can be skipped
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/docs_only.py

  skills:
    name: Skill tests (${{ matrix.shard }})
    needs: changes
    # Run even when the gate job failed: a missing output is not "true", so every shard runs.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [motion, motion-b, cad-model, freecad-gated, rest]
    env:
      # The one place that decides to skip: the gate job must have succeeded AND said exactly true.
      # A gate that wrote its output and then failed leaves a non-success result, so the shard runs.
      SKIP: ${{ needs.changes.result == 'success' && needs.changes.outputs.skip == 'true' }}
      FREECAD_APPIMAGE: FreeCAD_1.1.4-Linux-x86_64-py311.AppImage
      FREECAD_RELEASE: https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4
      FREECAD_DIR: ${{ github.workspace }}/../freecad-1.1.4
      # One interpreter for every script environment: the pair cache's rule identity includes the
      # Python and numpy versions, so tools that share it must run on the same build.
      UV_PYTHON: "3.12"
      UV_PYTHON_PREFERENCE: only-managed
      # Every shard installs FreeCAD, so a FreeCAD test that cannot find it fails instead of skipping.
      CAD_REQUIRE_FREECAD: "1"
      # "<shard> <test file> [<selector>...]", read by scripts/ci_shards.py. A file named here runs
      # only in its shards; the rest shard runs every other test file. A selector (a test class or
      # Class.test_name) moves those tests to its shard; the file's entry without selectors keeps the rest.
      SHARDS: |
        motion skills/cad-motion/tests/test_motion.py
        motion-b skills/cad-motion/tests/test_motion.py StepTests.test_a_killed_sweep_resumes_from_its_committed_chunks_and_equals_an_uninterrupted_one
        motion-b skills/cad-motion/tests/test_motion.py StepTests.test_the_bounds_hold_and_the_broad_phase_containment_skip_and_threads_change_no_measured_value
        motion-b skills/cad-motion/tests/test_motion.py StepTests.test_the_correctly_timed_v6_passes_and_reports_its_minimum_clearance
        motion-b skills/cad-motion/tests/test_motion.py StepTests.test_one_crank_sweeps_the_coupled_v6_and_finds_the_misphased_valve_at_its_tdc
        cad-model skills/cad-model/tests/test_cad_model.py
        cad-model skills/cad-model/tests/test_output_budget.py
        motion skills/cad-viewer/tests/test_viewer.py
        motion skills/cad-motion/tests/test_motion_render.py
        cad-model skills/cad-record/tests/test_design_rules.py
        cad-model skills/cad-record/tests/test_schema_drawing.py
        freecad-gated skills/cad-design/tests/test_process_checks.py
        freecad-gated skills/cad-model/tests/test_drawing_features.py
        freecad-gated skills/cad-analysis/tests/test_fea_static.py
        freecad-gated skills/cad-analysis/tests/test_fea_part_fixtures.py
        freecad-gated skills/cad-design/tests/test_design.py
        freecad-gated skills/cad-drawings/tests/test_assembly_end_to_end.py
        freecad-gated skills/cad-drawings/tests/test_drawing.py
        freecad-gated skills/cad-drawings/tests/test_drawing_framework.py
        freecad-gated skills/cad-drawings/tests/test_feature_recognition.py
        freecad-gated skills/cad-drawings/tests/test_part_drawings.py
        freecad-gated skills/cad-drawings/tests/test_section_hatch.py
        freecad-gated skills/cad-flow/tests/test_scratch.py
    # Every step below is gated on the same condition, so a skipped shard still reports success.
    steps:
      - name: Skip the shard
        if: env.SKIP == 'true'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          echo "::notice::shard $SHARD skipped: this pull request changes only paths no skill test reads"
          echo "Shard $SHARD skipped: the pull request changes only docs, agents, harness (except install.py), SKILL.md and references (except cad-record's layout.md)." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SKIP != 'true'

      - name: Collect PEP 723 dependency headers
        if: env.SKIP != 'true'
        run: |
          python3 - > skills-pep723-headers.txt <<'PY'
          import re
          import subprocess

          block = re.compile(r"(?m)^# /// script$\s(?P<content>(^#(| .*)$\s)+)^# ///$")
          files = subprocess.run(
              ["git", "ls-files", "-z", "skills/*.py", "skills/**/*.py"],
              capture_output=True,
              text=True,
              check=True,
          ).stdout
          headers = {
              match["content"]
              for path in files.split("\0")
              if path
              for match in block.finditer(open(path, encoding="utf-8").read())
          }
          print("".join(sorted(headers)), end="")
          PY

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: env.SKIP != 'true'
        with:
          enable-cache: true
          cache-dependency-glob: skills-pep723-headers.txt

      - name: Drop script environments restored from the uv cache
        if: env.SKIP != 'true'
        # A restored environment keeps the versions it was resolved with; a new one gets today's.
        run: rm -rf -- "$(uv cache dir)/environments-v2"

      - name: Cache the FreeCAD AppImage
        id: freecad-cache
        if: env.SKIP != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.FREECAD_DIR }}/download
          key: freecad-${{ env.FREECAD_APPIMAGE }}

      - name: Download the FreeCAD AppImage
        if: env.SKIP != 'true' && steps.freecad-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$FREECAD_DIR/download"
          curl --fail --location --silent --show-error --retry 3 --output-dir "$FREECAD_DIR/download" \
            --remote-name "$FREECAD_RELEASE/$FREECAD_APPIMAGE" \
            --remote-name "$FREECAD_RELEASE/$FREECAD_APPIMAGE-SHA256.txt"

      - name: Verify the FreeCAD AppImage
        if: env.SKIP != 'true'
        working-directory: ${{ env.FREECAD_DIR }}/download
        run: sha256sum --check "$FREECAD_APPIMAGE-SHA256.txt"

      - name: Install FreeCAD 1.1.4
        if: env.SKIP != 'true'
        working-directory: ${{ env.FREECAD_DIR }}
        run: |
          chmod +x "download/$FREECAD_APPIMAGE"
          "download/$FREECAD_APPIMAGE" --appimage-extract > /dev/null
          mkdir -p ~/.local/bin
          ln -sfn "$PWD/squashfs-root/usr/bin/freecadcmd" ~/.local/bin/freecadcmd
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ~/.local/bin/freecadcmd --version | tee version.txt
          grep -q 'FreeCAD 1\.1\.4' version.txt

      - name: Skill tests
        if: env.SKIP != 'true'
        env:
          SHARD: ${{ matrix.shard }}
          MFG_CORPUS_RATCHET_IN_CI_STEP: ${{ matrix.shard == 'rest' && '1' || '' }}
          JOB_INDEX: ${{ strategy.job-index }}
          JOBS: ${{ strategy.job-total }}
        run: |
          planned=$(python3 scripts/ci_shards.py files "$SHARD" "$JOB_INDEX" "$JOBS")
          mapfile -t files < <(printf '%s\n' "$planned" | grep .)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::shard $SHARD has no test files"
            exit 1
          fi

          failed=0
          printf '| Result | Seconds | Test file |\n|---|---:|---|\n' >> "$GITHUB_STEP_SUMMARY"
          for test in "${files[@]}"; do
            echo "::group::$test"
            started=$SECONDS
            result=pass
            uv run --no-project --with-requirements harness/test-requirements.txt \
              python -B scripts/ci_shards.py run "$SHARD" "$test" || result=FAIL
            echo "::endgroup::"
            elapsed=$((SECONDS - started))
            if [ "$result" = FAIL ]; then
              failed=$((failed + 1))
              echo "::error file=$test::$test failed"
            fi
            echo "$result ${elapsed}s $test"
            echo "| $result | $elapsed | \`$test\` |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "$failed of ${#files[@]} test files failed in shard $SHARD"
          [ "$failed" -eq 0 ]

      - name: Mutation corpus rates and baseline ratchet
        if: env.SKIP != 'true' && matrix.shard == 'freecad-gated'
        # The corpus mutants rely on recorded calibrations, so its baseline is measured with calibration on.
        env:
          CAD_CALIBRATION: "1"
        run: uv run --script skills/cad-design/tests/mfg_corpus/rates.py --check-baseline

      - name: Mutation corpus rates with calibration off (report only)
        if: env.SKIP != 'true' && matrix.shard == 'freecad-gated'
        # The release behaviour: calibration off, the shipped guideline sets govern. Printed for the log; it never gates.
        continue-on-error: true
        run: uv run --script skills/cad-design/tests/mfg_corpus/rates.py --out "$RUNNER_TEMP/mfg-corpus-rates-calibration-off.json"
