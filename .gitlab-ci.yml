image: python:3.12.12-slim-bookworm

default:
  tags:
    - arch:arm64
    - size:small
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl && rm -rf /var/lib/apt/lists/*
    - curl -LsSf https://github.com/astral-sh/uv/releases/download/0.13.6/uv-aarch64-unknown-linux-gnu.tar.gz | tar -xz --strip-components=1 -C /usr/local/bin uv-aarch64-unknown-linux-gnu/uv
  cache:
    key:
      files:
        - skills-pep723-headers.txt
    paths:
      - .cache/uv/
    policy: pull-push

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push"

stages:
  - test

collect-pep723-headers:
  stage: test
  script:
    - |
      python3 - > skills-pep723-headers.txt <<'PY'
      import re
      import subprocess

      block = re.compile(r"(?m)^# /// script$\s(?P<content>(^#(| .*)$\s)+)^# ///$")
      files = subprocess.run(
          ["git", "ls-files", "-z", "skills/*.py", "skills/**/*.py"],
          capture_output=True,
          text=True,
          check=True,
      ).stdout
      headers = {
          match["content"]
          for path in files.split("\0")
          if path
          for match in block.finditer(open(path, encoding="utf-8").read())
      }
      print("".join(sorted(headers)), end="")
      PY
  artifacts:
    paths:
      - skills-pep723-headers.txt
    expire_in: 1 day

cad-skill-tests:
  stage: test
  needs:
    - job: collect-pep723-headers
      artifacts: true
  script:
    - |
      status=0
      while IFS= read -r test; do
        uv run --no-project --with pyyaml==6.0.3 --with jsonschema==4.26.0 --with defusedxml==0.7.1 \
          python -B -m unittest discover -s "$(dirname "$test")" -p "$(basename "$test")" || status=1
      done < <(git ls-files 'skills/*/test_*.py' 'skills/*/tests/test_*.py')
      exit "$status"

harness-tests:
  stage: test
  needs:
    - job: collect-pep723-headers
      artifacts: true
  script:
    - python3 -m unittest discover -s harness -p 'test_*.py'
    - python3 harness/generate.py --check
