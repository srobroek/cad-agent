# Plan §11 row 10: a laser-cut tab in a laser-cut slot, both plates powder coated after cutting.
# Nominal clearance 3.10 - 3.00 = +0.10 mm, but the calibrated slot deviation, the stock thickness
# tolerance and the coating build-up give a worst case of -0.15..+0.20 mm. Synthetic TST values.
#   min = (3.10 - 0.05) - (3.00 + 0.08) - 0.06 - 0.06 = -0.15
#   max = (3.10 + 0.05) - (3.00 - 0.05) - 0.00 - 0.00 = +0.20
