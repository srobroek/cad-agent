# cad-record capability templates: fields and guidance only, never machine numbers.
# A template is never a capability: copy one into hw/manufacturing/capabilities.yaml and record your actual
# machine, operator or supplier, its parameters with their sources, and its calibrations.
profiles:
  - id: fdm_template
    revision: 1
    title: FDM printer (template)
    process: fdm
    provider: local
    template: true
    guidance:
      - Copy this profile into hw/manufacturing/capabilities.yaml, give it your own id, then remove template and guidance.
      - Record your actual machine, operator or supplier values with their sources; leave a value unknown, with its reason, until you have one.
      - 'Parameters describe the machine and are never its achieved accuracy: record achievable dimensions, features and finish only as calibrations from your own coupons, measurements or supplier evidence, each scoped to its material, feature, orientation, setup and tool.'
      - Record nozzle, filament, layer height, hotend, bed and enclosure limits, filament drying and support materials.
      - Calibrate walls, small features, holes, bridges, overhangs, warping and layer strength per filament profile, orientation and settings; a slicer preview or a print trial is evidence only for what it shows.
    machine:
      identity: {status: unknown, reason: 'template: record the make, model and identity of your machine'}
    operator: {status: unknown, reason: 'template: record who operates it and their constraints'}
    envelope:
      x: {status: unknown, reason: 'template: record the usable working envelope'}
      y: {status: unknown, reason: 'template: record the usable working envelope'}
      z: {status: unknown, reason: 'template: record the usable working envelope'}
    materials: {status: unknown, reason: 'template: list the exact materials and stock it is approved or forbidden for'}
    parameters:
      nozzle_diameter: {status: unknown, reason: 'template: record your own value'}
      nozzle_material: {status: unknown, reason: 'template: record your own value'}
      filament_diameter: {status: unknown, reason: 'template: record your own value'}
      layer_height: {status: unknown, reason: 'template: record your own value'}
      line_width: {status: unknown, reason: 'template: record your own value'}
